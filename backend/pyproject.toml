[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "therapy-office-backend"
version = "0.1.0"
description = "Backend for the therapy center EOPYY document application"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165",      # M5.0 relies on Depends(scope="function") and iter_route_contexts
    "uvicorn>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14",
    "python-docx>=1.1",     # document engine (M2)
    "lxml>=5.3",
    "pypdf>=5.0",           # PDF validation: page count, fonts, text (BSD; not AGPL PyMuPDF)
    "holidays>=0.60",       # Greek public holidays incl. Orthodox Easter (M3)
    "argon2-cffi>=23.1",    # Argon2id administrator password hashing (M5.0)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx2>=2.0",         # FastAPI TestClient
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["libreoffice: needs a LibreOffice installation (skipped when none is found)"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "fixtures", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]  # the documented FastAPI idiom

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/eopyy_builder.py" = ["E501"]  # embedded XML literals
"migrations/versions/*.py" = ["E501"]  # autogenerated DDL and embedded trigger SQL
